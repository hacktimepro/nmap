name: Build Windows (obfuscated)

on:
  push:
    branches: [ ss ]
    paths:
      - 'nmap.h'
      - 'nmap.cc'
      - 'NmapOps.cc'
      - 'output.cc'
      - 'mswin32/**'
      - '.github/workflows/build-windows-obfuscated.yml'
  pull_request:
    branches: [ ss ]
  workflow_dispatch:
    inputs:
      output_name:
        description: 'Output binary name (without .exe)'
        required: false
        default: 'netdiag'

env:
  OUTPUT_NAME: ${{ github.event.inputs.output_name || 'netdiag' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-obfuscated:
    name: Release Win32 (obfuscated)
    runs-on: windows-latest

    steps:
      # ------------------------------------------------------------------ #
      # 1. Checkout
      # ------------------------------------------------------------------ #
      - uses: actions/checkout@v4

      # ------------------------------------------------------------------ #
      # 2. Install SVN — нужен Build.bat для скачивания OpenSSL
      # ------------------------------------------------------------------ #
      - name: Install Subversion
        shell: pwsh
        run: |
          choco install svn -y --no-progress
          # SVN может быть в разных местах — добавляем оба
          "C:\Program Files (x86)\Subversion\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\Program Files\Subversion\bin"       | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "[+] SVN installed"

      # ------------------------------------------------------------------ #
      # 3. Cache nmap-mswin32-aux (Npcap SDK + OpenSSL)
      #    Build.bat кладёт зависимости в ..\nmap-mswin32-aux
      #    На GitHub runner checkout лежит в D:\a\nmap\nmap,
      #    значит aux = D:\a\nmap\nmap-mswin32-aux
      # ------------------------------------------------------------------ #
      - name: Cache nmap-mswin32-aux
        id: cache-aux
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\..\nmap-mswin32-aux
          key: nmap-mswin32-aux-v2-${{ runner.os }}

      # ------------------------------------------------------------------ #
      # 4. Build через Build.bat (VS detection, PCRE2 cmake, MSBuild всё внутри)
      # ------------------------------------------------------------------ #
      - name: Build (Build.bat Release)
        shell: cmd
        working-directory: mswin32
        run: |
          Build.bat Build Release
          if %ERRORLEVEL% neq 0 (
            echo [!] Build.bat failed with code %ERRORLEVEL%
            exit /b %ERRORLEVEL%
          )
          echo [+] Build complete

      # ------------------------------------------------------------------ #
      # 5. Проверяем что exe появился
      # ------------------------------------------------------------------ #
      - name: Verify binary exists
        shell: pwsh
        run: |
          $exe = "mswin32\Release\nmap.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "[!] nmap.exe not found at $exe — build likely failed silently"
            Get-ChildItem mswin32\Release -ErrorAction SilentlyContinue
            exit 1
          }
          $size = (Get-Item $exe).Length
          Write-Host "[+] nmap.exe found, size: $([math]::Round($size/1KB, 1)) KB"

      # ------------------------------------------------------------------ #
      # 6. Переименовать + аудит строк
      # ------------------------------------------------------------------ #
      - name: Rename and audit binary
        shell: pwsh
        run: |
          $src = "mswin32\Release\nmap.exe"
          $outName = "${{ env.OUTPUT_NAME }}.exe"
          $dst = "mswin32\Release\$outName"

          Rename-Item -Path $src -NewName $outName
          Write-Host "[+] Renamed to: $dst"

          Write-Host "[*] String audit (nmap|Insecure|scanme)..."
          $bytes = [System.IO.File]::ReadAllBytes($dst)
          $text  = [System.Text.Encoding]::ASCII.GetString($bytes)
          $hits  = ($text -split '\n') | Select-String -Pattern "nmap|Insecure\.Org|scanme" -CaseSensitive:$false
          if ($hits) {
            Write-Warning "[!] Residual strings ($($hits.Count) hits) — check obfuscation patches"
            $hits | Select-Object -First 20 | ForEach-Object { Write-Host "    $_" }
          } else {
            Write-Host "[+] Audit clean — no identifying artifacts."
          }

      # ------------------------------------------------------------------ #
      # 7. Собрать MSVC runtime DLL рядом с бинарём
      #    Бинарь собран /MD, поэтому нужны 3 DLL для работы на чистой системе
      # ------------------------------------------------------------------ #
      - name: Bundle MSVC runtime DLLs
        shell: pwsh
        run: |
          $dst = "mswin32\Release"
          $sys32 = "$env:SystemRoot\System32"
          $dlls  = @("MSVCP140.dll", "VCRUNTIME140.dll", "VCRUNTIME140_1.dll")

          foreach ($dll in $dlls) {
            $src = Join-Path $sys32 $dll
            if (Test-Path $src) {
              Copy-Item $src $dst
              Write-Host "[+] Bundled: $dll"
            } else {
              Write-Warning "[!] Not found: $src"
            }
          }

      # ------------------------------------------------------------------ #
      # 8. Upload артефакт (exe + DLL в одной папке)
      # ------------------------------------------------------------------ #
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT_NAME }}-win32-release
          path: mswin32\Release\
          retention-days: 14
          if-no-files-found: error

      # ------------------------------------------------------------------ #
      # 8. Upload MSBuild лог (всегда, даже при падении)
      # ------------------------------------------------------------------ #
      - name: Upload MSBuild log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msbuild-log
          path: mswin32\msbuild.log
          retention-days: 7
          if-no-files-found: ignore
